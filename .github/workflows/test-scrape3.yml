name: Тест доступа к форуму AntiO (через прокси)

on:
  workflow_dispatch: {}

jobs:
  test-scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установка зависимостей
        run: pip install requests beautifulsoup4

      - name: Запуск теста через прокси
        run: python scrape_test3.py

      - name: Сохранить результат как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: test-result-3
          path: |
            test_result.json
            test_result.html
          if-no-files-found: ignore
